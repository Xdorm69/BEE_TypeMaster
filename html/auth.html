<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEE TypeMaster — Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <header class="site-header">
        <div class="brand">

            <svg
                class="brand-mark"
                viewBox="0 0 34 34"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <polygon points="17,1 31,9 31,25 17,33 3,25 3,9" />
                <rect class="stripe" x="3" y="12" width="28" height="3" />
                <rect class="stripe" x="3" y="19" width="28" height="3" />
            </svg>

            <span class="brand-name">
                Bee<span>Type</span>Master
            </span>

        </div>
    </header>


    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">
                <h1 id="authTitle">Welcome Back</h1>

                <p id="authDescription">
                    Login to continue your typing journey.
                </p>
            </div>


            <div
                id="authError"
                class="auth-message auth-message--error"
                hidden
            ></div>


            <div
                id="authSuccess"
                class="auth-message auth-message--success"
                hidden
            ></div>


            <form id="authForm" novalidate>

                <div
                    class="form-group"
                    id="usernameGroup"
                    hidden
                >
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                    >
                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="submitButton"
                >
                    Login
                </button>

            </form>


            <div class="auth-switch">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button
                    type="button"
                    id="switchMode"
                    class="auth-switch__button"
                >
                    Sign up
                </button>

            </div>

        </section>

    </main>


    <script type="module" src="../js/auth.js"></script>

</body>

</html>
